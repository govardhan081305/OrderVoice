# coturn configuration for OrderVoice.
# Uses the "TURN REST API" scheme: the OrderVoice server hands each caller a
# short-lived username/password derived from this shared secret.

listening-port=3478
tls-listening-port=5349

# Replace with your VM's public IP (and private IP if behind NAT, e.g. AWS):
# external-ip=PUBLIC_IP/PRIVATE_IP
external-ip=CHANGE_ME_PUBLIC_IP

realm=ordervoice
fingerprint
use-auth-secret
# Must equal TURN_SECRET in the server's .env  (generate: openssl rand -hex 32)
static-auth-secret=CHANGE_ME_LONG_RANDOM_SECRET

# Relay port range: open these UDP ports in the cloud firewall / security group.
min-port=49160
max-port=49200

# Optional TLS (turns:) with Let's Encrypt certs:
# cert=/etc/letsencrypt/live/turn.yourdomain.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.yourdomain.com/privkey.pem

# Safety: never relay to private/internal networks.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
no-cli
total-quota=200
stale-nonce=600
log-file=stdout
simple-log
